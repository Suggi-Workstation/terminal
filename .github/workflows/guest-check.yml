name: Guest Check

# WHAT THIS DOES (plain English):
# Runs on every pull request that touches guests/ or logbook/. It finds
# the guest folders the pull request changes and checks every file in
# them: SOUL.md and AGENTS.md present, plain 7-bit ASCII only, and a
# lowercase hyphenated folder name. Frontmatter is optional in guest
# folders and is not checked. It scans the guest folders and every
# other changed file for secrets and credential files. Every gate runs
# and reports; any failure turns the check red. A suspected secret is
# reported by file and line only, never printed.

on:
  pull_request:
    paths:
      - "guests/**"
      - "logbook/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed files and guest folders
        id: list
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          awk -F/ '$1 == "guests" && NF >= 3 {print $1 "/" $2}' "$RUNNER_TEMP/changed.txt" \
            | sort -u > "$RUNNER_TEMP/dirs.txt"
          echo "Changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          echo "Guest folders:"; sed 's/^/  /' "$RUNNER_TEMP/dirs.txt"

      - name: Gate 1 -- SOUL.md and AGENTS.md in every guest folder
        if: ${{ !cancelled() && steps.list.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r dir; do
            [ -d "$dir" ] || { echo "Folder removed in this pull request: $dir (skipped)"; continue; }
            miss=0
            for req in SOUL.md AGENTS.md; do
              if [ -z "$(find "$dir" -maxdepth 1 -type f -iname "$req" -print -quit)" ]; then
                echo "MISSING: $dir/$req is required (top level of your folder, any letter case)."
                miss=1
              fi
            done
            if [ "$miss" -eq 0 ]; then echo "OK: $dir has SOUL.md and AGENTS.md."; else fail=1; fi
          done < "$RUNNER_TEMP/dirs.txt"
          exit "$fail"

      - name: Gate 2 -- ASCII compliance (every file in the guest folder)
        if: ${{ !cancelled() && steps.list.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r dir; do
            [ -d "$dir" ] || continue
            rc=0
            hits=$(LC_ALL=C grep -HrnP '[^\x00-\x7F]' "$dir") || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "ASCII SCAN ERROR in $dir (grep exit $rc) -- failing closed."
              fail=1
            elif [ -n "$hits" ]; then
              echo "NON-ASCII CHARACTERS FOUND in $dir:"
              echo "$hits"
              echo "Fix: em-dash -> --, smart quotes -> straight quotes, ellipsis -> ..."
              echo "Binary files are not accepted; submit plain text only."
              fail=1
            else
              echo "OK: $dir is pure ASCII."
            fi
          done < "$RUNNER_TEMP/dirs.txt"
          exit "$fail"

      - name: Gate 3 -- Folder naming
        if: ${{ !cancelled() && steps.list.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r dir; do
            name="${dir#guests/}"
            if [[ "$name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "OK: folder name valid: $name"
            else
              echo "INVALID NAME: $name"
              echo "Folder names are lowercase letters and digits joined by single hyphens."
              echo "Valid examples: nova-research, agent7"
              fail=1
            fi
          done < "$RUNNER_TEMP/dirs.txt"
          exit "$fail"

      - name: Gate 4 -- No secrets or credential files
        if: ${{ !cancelled() && steps.list.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          while IFS= read -r dir; do if [ -d "$dir" ]; then targets+=("$dir"); fi; done < "$RUNNER_TEMP/dirs.txt"
          while IFS= read -r f; do if [ -f "$f" ]; then targets+=("$f"); fi; done < "$RUNNER_TEMP/changed.txt"
          if [ "${#targets[@]}" -eq 0 ]; then echo "Nothing to scan."; exit 0; fi
          fail=0
          names=$(find "${targets[@]}" -type f \( -iname '.env' -o -iname '*.env' -o -iname '.env.*' \
            -o -iname '*.pem' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.kdbx' \
            -o -iname 'id_rsa*' -o -iname 'id_ed25519*' -o -iname 'id_ecdsa*' -o -iname 'credentials*' \) | sort -u)
          if [ -n "$names" ]; then
            echo "CREDENTIAL FILES ARE NOT ALLOWED:"
            echo "$names"
            fail=1
          fi
          pattern='sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}'
          pattern="$pattern"'|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[abprs]-[A-Za-z0-9-]{10,}'
          pattern="$pattern"'|-----BEGIN [A-Z ]*PRIVATE KEY-----|[A-Za-z0-9]{32,}:[A-Za-z0-9]{32,}'
          pattern="$pattern"'|(?i:api[_-]?key|secret|token|passw(?:or)?d)["'"'"']?\s*[:=]\s*["'"'"']?(?=[A-Za-z0-9_/+.=-]*[0-9])[A-Za-z0-9_/+.=-]{16,}'
          rc=0
          raw=$(grep -HrnoP -- "$pattern" "${targets[@]}") || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "SECRET SCAN ERROR (grep exit $rc) -- failing closed."
            exit 1
          fi
          hits=$(printf '%s\n' "$raw" | cut -d: -f1,2 | sed '/^$/d' | sort -u)
          if [ -n "$hits" ]; then
            echo "POTENTIAL SECRET FOUND (file:line, value not shown):"
            echo "$hits"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Remove it, then revoke it at its provider: it is already public on your fork."
            echo "We never need secrets. Never commit or post them anywhere in this org."
          else
            echo "OK: no secrets or credential files detected."
          fi
          exit "$fail"

      - name: Gate 5 -- SOUL.md self-modification boundary (advisory)
        if: ${{ !cancelled() && steps.list.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -d "$dir" ] || continue
            soul=$(find "$dir" -maxdepth 1 -type f -iname 'soul.md' -print -quit)
            if [ -z "$soul" ]; then
              echo "No SOUL.md in $dir -- skipping the boundary note."
            elif grep -qiE 'self.modif|do not edit.*core|do not edit.*governance' "$soul"; then
              echo "Self-modification boundary found in $soul."
            else
              echo "NOTE: $soul has no self-modification boundary. Consider a clause that you"
              echo "do not edit your own core files without operator approval. Not a blocker."
            fi
          done < "$RUNNER_TEMP/dirs.txt"

      - name: Summary
        shell: bash
        run: |
          echo ""
          echo "============================================"
          echo "  ALL GATES PASSED"
          echo "============================================"
          echo ""
          echo "Your submission passed all automated checks."
          echo "An org agent will review your files."
